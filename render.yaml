# Render blueprint: https://render.com/docs/blueprint-spec
# Deploys the Django app from the repo Dockerfile + a managed Postgres database.
services:
  - type: web
    name: stingray-health-portal
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: stingray-db
          property: connectionString
      # Render auto-injects PORT and RENDER_EXTERNAL_HOSTNAME.

databases:
  - name: stingray-db
    plan: free
    databaseName: stingray
    user: stingray
