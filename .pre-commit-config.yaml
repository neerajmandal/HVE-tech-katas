# Pre-commit configuration for the Stingray Health Portal
# See https://pre-commit.com for more information
#
# Install hooks: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-2
    hooks:
      - id: shfmt
        args: [--diff]

  # strip output from notebooks
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        args: [--verify]

  # Ruff linting - runs separately from formatting
  # Each package uses its own pyproject.toml configuration
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      # Run the linter.
      - id: ruff-check
        types_or: [python, pyi, jupyter]

      # Run the formatter.
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: local
    hooks:
      # python tests
      - id: pytest
        name: pytest
        stages: ["pre-push"]
        language: system
        types: [python]
        pass_filenames: false
        entry: pytest

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        # Optional: exclude generated/large files:
        exclude: package.lock.json
