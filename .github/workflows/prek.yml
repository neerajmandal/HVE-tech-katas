name: Pre-commit hook CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  prek:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          for d in verticals/*/; do
            if [ -f "$d/pyproject.toml" ]; then
              echo "::group::uv sync $d"
              (cd "$d" && uv sync --group dev)
              echo "::endgroup::"
            fi
          done

      - name: Run pre-commit hooks (default stage)
        run: uvx prek run --all-files --show-diff-on-failure

      - name: Run pre-commit hooks (pre-push stage)
        run: uvx prek run --all-files --hook-stage pre-push --show-diff-on-failure
